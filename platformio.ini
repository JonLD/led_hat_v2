; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
platform = espressif32
board = az-delivery-devkit-v4
framework = espidf
monitor_speed = 115200

[env:light_device]
; Optimization flag (applies to both C and C++)
build_flags =
    -O3

; C++ flags are set in src/CMakeLists.txt to avoid applying to C files

; ESP-IDF libraries
lib_deps =
    https://github.com/bbulkow/FastLED-idf.git
    ; ArduinoFFT replacement: will use esp-dsp component (native ESP-IDF)

; Com port which your light device ESP32 is connected via
; upload_port = /dev/ttyUSB0
; monitor_port = /dev/ttyUSB0
